<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Leaf icon -->
  <g transform="translate(60, 50)">
    <!-- Stem -->
    <path d="M45 100 Q40 70 30 50 Q25 40 20 35" stroke="url(#stemGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M30 50 Q10 35 15 20 Q20 10 35 15 Q40 20 45 30 Q48 40 30 50Z" fill="url(#leafGrad)" opacity="0.95"/>
    <!-- Right leaf -->
    <path d="M35 55 Q55 40 60 25 Q65 15 50 10 Q40 10 30 20 Q25 30 35 55Z" fill="url(#leafGrad)" opacity="0.75"/>
    <!-- Small top leaf -->
    <path d="M22 38 Q8 28 12 16 Q16 8 26 12 Q32 18 28 30 Q25 35 22 38Z" fill="url(#leafGrad)" opacity="0.55"/>
  </g>

  <!-- Brand name -->
  <text x="160" y="105" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#2563eb" letter-spacing="1">Samruddhi Bengaluru</text>

  <!-- Tagline -->
  <text x="160" y="145" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#4b5563" letter-spacing="3">&#x2022; by Mitra &#x2022;</text>

  <!-- Decorative line -->
  <line x1="160" y1="120" x2="540" y2="120" stroke="#3b82f6" stroke-width="2" opacity="0.35"/>
</svg>
